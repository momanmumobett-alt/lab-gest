<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAB-GEST</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #166534;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: right;
    }

    th {
      background: #e8f5e9;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      background: #f0f0f0;
    }
  </style>
</head>

<body>

<header>
  <h1>LAB-GEST</h1>
  <p>تسيير مخبر العلوم</p>
</header>

<div class="container">

  <div class="card">
    <h2>📦 العتاد والتجهيزات</h2>
    <div id="message" class="message">جاري تحميل البيانات...</div>

    <table id="equipmentTable" style="display:none;">
      <thead>
        <tr>
          <th>اسم العتاد</th>
          <th>رقم الجرد</th>
          <th>الكمية</th>
          <th>الحالة</th>
          <th>المكان</th>
          <th>ملاحظات</th>
        </tr>
      </thead>
      <tbody id="equipmentBody"></tbody>
    </table>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://mxpojwfvuthvajuerkun.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2aQTLjb86tQJMFaZ0AZHYw__WHSQuP-";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadEquipment() {
    const message = document.getElementById("message");
    const table = document.getElementById("equipmentTable");
    const body = document.getElementById("equipmentBody");

    const { data, error } = await supabase
      .from("equipment")
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      message.textContent = "حدث خطأ في تحميل العتاد: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      message.textContent = "لا توجد معدات مسجلة حاليًا.";
      return;
    }

    message.style.display = "none";
    table.style.display = "table";

    body.innerHTML = "";

    data.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${item.name ?? ""}</td>
        <td>${item.inventory_number ?? ""}</td>
        <td>${item.quantity ?? ""}</td>
        <td>${item.condition ?? ""}</td>
        <td>${item.location ?? ""}</td>
        <td>${item.notes ?? ""}</td>
      `;

      body.appendChild(row);
    });
  }

  loadEquipment();
</script>

</body>
</html>
